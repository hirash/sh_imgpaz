<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd0ec">
<title>しゃしんパズル ✨</title>
<style>
  :root{
    --pink:#ff8ac4; --pink2:#ff5fb0; --purple:#b48cff; --purple2:#9a6bff;
    --mint:#7fe0c4; --yellow:#ffd86b; --grape:#7a4a86; --cream:#fff6fb;
    --line:#c9a7ff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","M PLUS Rounded 1c","Rounded Mplus 1c",system-ui,sans-serif;
    color:var(--grape);
    background:linear-gradient(160deg,#ffe3f3 0%,#f3e6ff 45%,#e6f0ff 100%);
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  /* ふわふわ背景 */
  .bg{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bg span{ position:absolute; bottom:-40px; font-size:28px; opacity:.55;
    animation:floaty linear infinite; }
  @keyframes floaty{ to{ transform:translateY(-115vh) rotate(360deg); opacity:.15; } }

  #app{ position:relative; z-index:1; height:100%; }
  .screen{ position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; padding:16px; text-align:center; }
  .screen.on{ display:flex; animation:pop .35s ease; }
  /* 内容が縦にあふれる画面はスクロールできるように（見切れ防止） */
  #s-photo, #s-level, #s-settings{ justify-content:flex-start; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:24px 16px 32px; }
  @keyframes pop{ from{ transform:scale(.92); opacity:0 } to{ transform:scale(1); opacity:1 } }

  h1{ font-size:clamp(30px,7vw,56px); margin:.1em 0; color:var(--pink2);
      text-shadow:0 3px 0 #fff,0 6px 14px rgba(255,120,190,.35); letter-spacing:.02em; }
  .sub{ font-size:clamp(15px,3.5vw,22px); color:var(--purple2); margin-bottom:24px; }

  .btn{ border:none; cursor:pointer; font-family:inherit; font-weight:800;
    color:#fff; border-radius:999px; padding:16px 30px; font-size:clamp(18px,4vw,24px);
    background:linear-gradient(180deg,var(--pink),var(--pink2));
    box-shadow:0 6px 0 #d94b95,0 10px 20px rgba(217,75,149,.35);
    transition:transform .08s, box-shadow .08s; margin:8px; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #d94b95,0 6px 12px rgba(217,75,149,.35); }
  .btn.purple{ background:linear-gradient(180deg,var(--purple),var(--purple2));
    box-shadow:0 6px 0 #7a4fe0,0 10px 20px rgba(122,79,224,.35); }
  .btn.purple:active{ box-shadow:0 2px 0 #7a4fe0,0 6px 12px rgba(122,79,224,.35); }
  .btn.small{ padding:11px 20px; font-size:clamp(15px,3.4vw,19px); }
  .btn.ghost{ background:#fff; color:var(--purple2);
    box-shadow:0 5px 0 #e6d4ff,0 8px 16px rgba(180,140,255,.25); }
  .btn.ghost:active{ box-shadow:0 2px 0 #e6d4ff; }

  .row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; }

  /* しゃしんえらび */
  .samples{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin:10px 0 22px; }
  .sample{ width:clamp(110px,26vw,160px); height:clamp(110px,26vw,160px);
    border-radius:24px; border:6px solid #fff; overflow:hidden; cursor:pointer;
    box-shadow:0 8px 18px rgba(180,120,220,.35); background-size:cover; background-position:center;
    transition:transform .1s; }
  .sample:active{ transform:scale(.94); }

  /* さいきんの しゃしん（履歴） */
  #historyWrap{ width:min(680px,94vw); margin-top:6px; }
  .histTitle{ font-size:16px; font-weight:800; color:var(--purple2); margin:6px 0 10px; }
  #history .sample{ width:clamp(84px,20vw,120px); height:clamp(84px,20vw,120px); position:relative; }
  .histItem{ position:relative; }
  .histDel{ position:absolute; top:-8px; right:-8px; width:30px; height:30px; border:none; cursor:pointer;
    border-radius:50%; background:#fff; color:var(--pink2); font-weight:900; font-size:16px; line-height:1;
    box-shadow:0 3px 8px rgba(180,120,220,.4); z-index:2; }
  .histItem .sample{ margin:0; }

  /* レベルえらび */
  .levels{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:14px; width:min(680px,94vw); margin:8px 0 20px; }
  .level{ position:relative; background:#fff; border:none; cursor:pointer; border-radius:22px; padding:18px 12px;
    box-shadow:0 6px 0 #ecdcff,0 10px 20px rgba(180,140,255,.25); font-family:inherit;
    transition:transform .1s, opacity .15s; }
  .level:active{ transform:translateY(3px); box-shadow:0 3px 0 #ecdcff; }
  .level .emoji{ font-size:40px; display:block; }
  .level .name{ font-size:21px; font-weight:800; color:var(--purple2); margin-top:4px; }
  .level .desc{ font-size:13px; color:var(--grape); margin-top:2px; }
  .level .stars{ color:var(--yellow); font-size:16px; }
  /* せってい用：オン/オフのチェック */
  .level .check{ position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background:#4fcf82; box-shadow:inset 0 0 0 2px #fff; }
  .level .check::after{ content:''; position:absolute; left:9px; top:5px; width:6px; height:11px;
    border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg); }
  .level.off{ opacity:.5; filter:grayscale(.55); }
  .level.off .check{ background:#c9b8e6; }
  .level.off .check::after{ display:none; }

  /* ゲームがめん */
  #game{ display:flex; flex-direction:column; padding:0; }
  .topbar{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding:8px 12px; }
  .board-area{ flex:0 0 auto; display:flex; justify-content:center; align-items:center; padding:4px; }
  .board{ position:relative; border-radius:18px; overflow:visible;
    background:#fff; box-shadow:0 10px 26px rgba(150,100,200,.28), inset 0 0 0 6px #fff;
    outline:6px solid #fff; }
  .board .guide{ position:absolute; inset:0; background-size:cover; background-position:center;
    opacity:.18; border-radius:12px; }
  .board .grid{ position:absolute; inset:0; }
  .slotdot{ position:absolute; border-radius:50%; background:rgba(180,140,255,.15); pointer-events:none; }

  .tray{ flex:1 1 auto; overflow:auto; display:flex; flex-wrap:wrap;
    justify-content:center; align-content:flex-start; gap:6px; padding:10px 8px 18px;
    background:linear-gradient(180deg,rgba(255,255,255,.0),rgba(255,255,255,.55));
    border-radius:26px 26px 0 0; margin-top:2px; }

  .piece{ position:relative; background-repeat:no-repeat; cursor:grab;
    filter:drop-shadow(0 3px 3px rgba(120,70,160,.35)); touch-action:none; z-index:2; }
  .piece.square{ border-radius:8px; }
  .piece.dragging{ position:fixed; z-index:9999; cursor:grabbing; opacity:.94;
    filter:drop-shadow(0 14px 16px rgba(120,70,160,.55)); }
  .piece.placed{ z-index:3; }
  /* ドロップ先（運んでいるマス）を光らせる */
  .dropHint{ position:absolute; border-radius:12px; pointer-events:none; z-index:2; display:none;
    background:rgba(180,140,255,.18);
    box-shadow:0 0 0 4px rgba(180,140,255,.7), 0 0 22px rgba(180,140,255,.55);
    animation:hintpulse .9s ease-in-out infinite; }
  .dropHint.ok{ background:rgba(120,220,160,.24);
    box-shadow:0 0 0 5px rgba(70,205,130,.85), 0 0 26px rgba(70,205,130,.6); }
  @keyframes hintpulse{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.04) } }
  .piece.locked{ filter:drop-shadow(0 2px 2px rgba(120,70,160,.25)); cursor:default; }
  .piece.wiggle{ animation:wig .4s ease; }
  @keyframes wig{ 0%,100%{transform:var(--rot)} 25%{transform:var(--rot) translateX(-4px)} 75%{transform:var(--rot) translateX(4px)} }
  .piece.spin{ transition:transform .18s cubic-bezier(.34,1.56,.64,1); }

  .badge{ background:#fff; border-radius:999px; padding:6px 14px; font-weight:800;
    color:var(--purple2); box-shadow:0 4px 10px rgba(180,140,255,.25); font-size:16px; }
  .hidden{ display:none !important; }

  /* おいわい */
  #win{ background:rgba(255,255,255,.6); backdrop-filter:blur(3px); z-index:9600;
    overflow-y:auto; padding:16px; }
  .winCard{ background:transparent; border-radius:30px; padding:0; max-width:96vw;
    display:flex; flex-direction:column; align-items:center;
    animation:popIn .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn{ from{ opacity:0 } to{ opacity:1 } }
  .winCard h1{ font-size:clamp(22px,5vw,34px); margin:12px 0 2px; }
  .winCard .sub{ font-size:clamp(13px,3vw,17px); margin-bottom:14px; }
  /* おいわい：完成した絵を「ドーン！」と大きく出す（パズル中より大きい） */
  .winBurst{ position:relative; width:min(92vw,64vh); height:min(92vw,64vh);
    margin:0 auto; display:flex; align-items:center; justify-content:center; }
  .rays{ position:absolute; width:170%; height:170%; left:-35%; top:-35%; border-radius:50%;
    background:repeating-conic-gradient(from 0deg, rgba(255,214,107,.6) 0 9deg, rgba(255,255,255,0) 9deg 18deg);
    -webkit-mask:radial-gradient(circle, #000 30%, rgba(0,0,0,.22) 55%, transparent 72%);
            mask:radial-gradient(circle, #000 30%, rgba(0,0,0,.22) 55%, transparent 72%);
    animation:spin 9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .winImg{ position:relative; z-index:1; width:100%; height:100%; border-radius:30px;
    border:8px solid #fff; background-size:cover; background-position:center;
    box-shadow:0 16px 40px rgba(150,90,200,.5);
    animation:tadaPop .8s cubic-bezier(.34,1.56,.64,1), bob 2.6s ease .8s infinite; }
  @keyframes tadaPop{ 0%{transform:scale(.15) rotate(-16deg); opacity:0} 55%{transform:scale(1.1) rotate(5deg); opacity:1} 100%{transform:scale(1) rotate(0)} }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-8px) rotate(1deg)} }
  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:9700; overflow:hidden; }
  .confetti span{ position:absolute; top:-50px; background-repeat:no-repeat; background-size:contain;
    animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(118vh) rotate(720deg); opacity:.85 } }

  .spark{ position:absolute; pointer-events:none; font-size:22px; z-index:8000;
    animation:sparkle .7s ease forwards; }
  @keyframes sparkle{ from{ transform:scale(.2); opacity:1 } to{ transform:scale(1.8) translateY(-24px); opacity:0 } }

  .ver{ position:absolute; bottom:14px; left:0; right:0; text-align:center;
    font-size:13px; font-weight:700; color:var(--purple2); opacity:.6; letter-spacing:.03em; }
  .ricon{ display:inline-block; width:18px; height:18px; vertical-align:-3px; margin-right:6px;
    background-size:contain; background-repeat:no-repeat; background-position:center; }
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<div id="app">
  <!-- タイトル -->
  <section class="screen on" id="s-title">
    <button class="btn ghost small" id="settingsBtn" style="position:absolute;top:14px;right:14px;padding:8px 16px;">せってい</button>
    <div style="font-size:64px">🧩🌸</div>
    <h1>しゃしんパズル</h1>
    <p class="sub">すきな しゃしんで あそぼう！</p>
    <button class="btn" id="startBtn">はじめる ▶</button>
    <button class="btn ghost small" id="reloadBtn" style="margin-top:14px;"><span class="ricon" id="ricon"></span>さいしんに する</button>
    <p class="ver" id="ver"></p>
  </section>

  <!-- せってい：ひょうじするレベル -->
  <section class="screen" id="s-settings">
    <h1 style="font-size:clamp(22px,5vw,36px)">ひょうじ する レベル</h1>
    <p class="sub">あそぶ レベルを えらんでね（タップで オン・オフ）</p>
    <div class="levels" id="settingsLevels"></div>
    <button class="btn" id="settingsDone">できた ▶</button>
  </section>

  <!-- しゃしんえらび -->
  <section class="screen" id="s-photo">
    <h1 style="font-size:clamp(24px,6vw,40px)">どの しゃしん？</h1>
    <div class="samples" id="samples"></div>
    <div class="row">
      <button class="btn purple" id="cameraBtn">📷 しゃしんを とる・えらぶ</button>
      <button class="btn ghost small" id="backToTitle">◀ もどる</button>
    </div>
    <div id="historyWrap" class="hidden">
      <p class="histTitle">🕐 さいきん つかった しゃしん</p>
      <div class="samples" id="history"></div>
    </div>
    <input type="file" id="fileInput" accept="image/*" class="hidden">
  </section>

  <!-- レベルえらび -->
  <section class="screen" id="s-level">
    <h1 style="font-size:clamp(24px,6vw,40px)">どれで あそぶ？</h1>
    <div class="levels" id="levels"></div>
    <button class="btn ghost small" id="backToPhoto">◀ しゃしんを かえる</button>
  </section>

  <!-- ゲーム -->
  <section class="screen" id="s-game" style="justify-content:flex-start">
    <div class="topbar">
      <button class="btn ghost small" id="quitBtn">◀ やめる</button>
      <span class="badge" id="progress">0 / 0</span>
      <div class="row" style="gap:6px">
        <button class="btn ghost small" id="hintBtn">👀 おてほん</button>
        <button class="btn ghost small" id="againBtn">🔀 もういちど</button>
      </div>
    </div>
    <div class="board-area">
      <div class="board" id="board">
        <div class="guide" id="guide"></div>
        <div class="grid" id="grid"></div>
        <div class="dropHint" id="dropHint"></div>
      </div>
    </div>
    <div class="tray" id="tray"></div>
  </section>
</div>

<!-- おいわい -->
<section class="screen" id="win">
  <div class="winCard">
    <div class="winBurst">
      <div class="rays"></div>
      <div class="winImg" id="winImg"></div>
    </div>
    <h1>パンパカパーン！</h1>
    <p class="sub" id="winMsg">できたね！</p>
    <div class="row">
      <button class="btn" id="winAgain">🔀 もういちど</button>
      <button class="btn purple" id="winNew">🖼 べつの しゃしん</button>
    </div>
  </div>
</section>

<div class="confetti" id="confetti"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ---------- バージョン（更新のたびに数字を上げる） ---------- */
const VERSION = 'ver 2.4 ・ 2026-07-22';
$('#ver').textContent = VERSION;

/* ---------- 装飾の図形（絵文字を使わずSVGで描く：どの端末でも必ず表示） ---------- */
const SHAPES=[
  c=>`<path fill="${c}" d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17.6 5.9 20.4l1.5-6.8L2.2 9l6.9-.7z"/>`,                 // ほし
  c=>`<path fill="${c}" d="M12 21S3 14.6 3 8.6C3 5.5 5.4 3.6 8 4.2 9.6 4.6 11 6 12 7.4 13 6 14.4 4.6 16 4.2c2.6-.6 5 1.3 5 4.4 0 6-9 12.4-9 12.4z"/>`, // ハート
  c=>`<g fill="${c}"><circle cx="12" cy="6" r="4.2"/><circle cx="12" cy="18" r="4.2"/><circle cx="6" cy="12" r="4.2"/><circle cx="18" cy="12" r="4.2"/></g><circle cx="12" cy="12" r="3.4" fill="#ffe14d"/>`, // はな
  c=>`<circle cx="12" cy="12" r="7.5" fill="${c}"/>`,                                                                    // まる
  c=>`<path fill="${c}" d="M12 3c.9 5 3.1 7.1 8 8-4.9.9-7.1 3.1-8 8-.9-4.9-3.1-7.1-8-8 4.9-.9 7.1-3.1 8-8z"/>`,          // きらきら
];
const PAL=['#ff8ac4','#b48cff','#ffd23f','#7fe0c4','#ff9f5a','#8fd0ff','#ff5b8a','#ff9ec2'];
function svgURI(inner){ return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">${inner}</svg>`); }
function randShapeURI(){ return svgURI(SHAPES[(Math.random()*SHAPES.length)|0](PAL[(Math.random()*PAL.length)|0])); }
function setShape(el,size){ el.style.width=el.style.height=size+'px'; el.style.backgroundImage=`url("${randShapeURI()}")`;
  el.style.backgroundSize='contain'; el.style.backgroundRepeat='no-repeat'; el.style.backgroundPosition='center'; }

/* ---------- ふわふわ背景 ---------- */
(function(){
  const bg = $('#bg');
  for(let i=0;i<16;i++){
    const s=document.createElement('span');
    setShape(s, 18+Math.random()*26);
    s.style.left=(Math.random()*100)+'vw';
    s.style.animationDuration=(9+Math.random()*10)+'s';
    s.style.animationDelay=(-Math.random()*15)+'s';
    bg.appendChild(s);
  }
})();

/* ---------- 効果音（自前生成・ファイル不要） ---------- */
let AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(freq,dur,type='sine',t0=0,vol=.2){
  const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.value=freq;
  const start=ac.currentTime+t0;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(vol,start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,start+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(start); o.stop(start+dur+0.03);
}
const sfx={
  pop(){ tone(520,.12,'sine',0,.18); tone(780,.12,'sine',.02,.12); },
  rotate(){ tone(440,.09,'triangle',0,.15); tone(660,.09,'triangle',.05,.12); },
  lock(){ tone(660,.14,'sine'); tone(880,.16,'sine',.09); tone(1175,.2,'sine',.18); },
  wrong(){ tone(240,.16,'square',0,.12); tone(190,.18,'square',.08,.1); },
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.32,'triangle',i*0.13,.16)); }
};

/* ---------- ユーティリティ ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- 画面きりかえ ---------- */
function show(id){ $$('.screen').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); }

/* ---------- サンプル画像を描く（絵文字を使わず図形だけで描画：iPadでも確実に表示） ---------- */
function makeSample(kind){
  const S=512;
  const c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
  const bg=(a,b)=>{ const g=x.createLinearGradient(0,0,0,S); g.addColorStop(0,a); g.addColorStop(1,b); x.fillStyle=g; x.fillRect(0,0,S,S); };
  const circle=(cx,cy,r,col)=>{ x.beginPath(); x.arc(cx,cy,r,0,7); x.fillStyle=col; x.fill(); };
  const tri=(a,b,cc,d,e,f,col)=>{ x.beginPath(); x.moveTo(a,b); x.lineTo(cc,d); x.lineTo(e,f); x.closePath(); x.fillStyle=col; x.fill(); };
  const rrect=(px,py,w,h,r,col)=>{ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); x.fillStyle=col; x.fill(); };
  const star=(cx,cy,r,col,pts=5)=>{ x.beginPath(); for(let i=0;i<pts*2;i++){ const rr=i%2?r*0.45:r; const a=Math.PI/pts*i-Math.PI/2; x[i?'lineTo':'moveTo'](cx+Math.cos(a)*rr, cy+Math.sin(a)*rr);} x.closePath(); x.fillStyle=col; x.fill(); };
  const heart=(cx,cy,r,col)=>{ circle(cx-r*0.5,cy-r*0.35,r*0.55,col); circle(cx+r*0.5,cy-r*0.35,r*0.55,col); tri(cx-r*0.98,cy-r*0.1,cx+r*0.98,cy-r*0.1,cx,cy+r,col); };
  const dots=(col,r,step)=>{ for(let gy=step/2, row=0; gy<S; gy+=step, row++) for(let gx=(row%2?step/2:step); gx<S; gx+=step) circle(gx,gy,r,col); };

  if(kind==='rainbow'){
    bg('#bfe9ff','#eafaff');
    dots('rgba(255,255,255,.55)',6,74);                     // きらきら空
    const cols=['#ff7bac','#ff9f5a','#ffe14d','#7be07b','#5ac8ff','#b48cff'];
    cols.forEach((col,i)=>{ x.beginPath(); x.lineWidth=22; x.lineCap='round'; x.strokeStyle=col; x.arc(256,486,150+i*22,Math.PI,0); x.stroke(); });
    circle(430,96,44,'#ffd23f');                            // たいよう

const HKEY='shimgpaz_history_v1';
function loadHistory(){ try{ const a=JSON.parse(localStorage.getItem(HKEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveHistory(arr){
  let a=arr.slice(0,8);
  while(a.length){ try{ localStorage.setItem(HKEY, JSON.stringify(a)); return; }catch(e){ a=a.slice(0,a.length-1); } } // 容量オーバーは古いものから削る
  try{ localStorage.removeItem(HKEY); }catch(e){}
}
function addToHistory(dataURL){ const h=loadHistory().filter(u=>u!==dataURL); h.unshift(dataURL); saveHistory(h); }
function renderHistory(){
  const wrap=$('#historyWrap'), grid=$('#history'); const h=loadHistory();
  grid.innerHTML='';
  if(!h.length){ wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  h.forEach(url=>{

    item.appendChild(d); item.appendChild(del); grid.appendChild(item);

}

function loadUserPhoto(file){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=c.height=768; const x=c.getContext('2d');
      const side=Math.min(img.width,img.height);
      const sx=(img.width-side)/2, sy=(img.height-side)/2;
      x.drawImage(img,sx,sy,side,side,0,0,768,768);
      G.photo=c.toDataURL('image/jpeg',0.85);
      addToHistory(G.photo);
      goLevels();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- ゲーム開始 ---------- */
function computeBoardPx(){
  const vw=window.innerWidth, vh=window.innerHeight;
  return Math.floor(Math.min(vw*0.92, vh*0.55, 560));
}
function startGame(L){
  G.level=L; G.cols=L.cols; G.rows=L.rows; G.shape=L.shape; G.rotate=L.rotate;
  G.hint=true; $('#hintBtn').classList.remove('off');
  buildPuzzle();
  show('s-game');
  layoutAll();
}
function randRot(){ const opts=[90,180,270]; return opts[Math.floor(Math.random()*opts.length)]; }

function resetGame(){
  // 前回の内容を片付ける（ドラッグ中・トレイ・盤面・body直下のピースをすべて除去）
  if(drag){
    document.removeEventListener('pointermove',onDocMove);
    document.removeEventListener('pointerup',onDocUp);
    document.removeEventListener('pointercancel',onDocCancel);
    drag=null;
  }
  $$('.piece').forEach(el=>el.remove());
  $('#tray').innerHTML='';
  const hint=$('#dropHint'); if(hint){ hint.style.display='none'; hint.classList.remove('ok'); }
}

// セルを分割する形（clip-path と 丸かどうか）
function subSlotsForCell(shape){
  switch(shape){
    case 'square': return [{clip:null, circle:false}];
    case 'tri':    return [{clip:'polygon(0 0,100% 0,100% 100%)'},{clip:'polygon(0 0,100% 100%,0 100%)'}]; // 三角ふたつ
    case 'circle2':return [{clip:'inset(0 0 50% 0)',circle:true},{clip:'inset(50% 0 0 0)',circle:true}];   // 半円（上下）
    case 'circle4':return [ // 四分円（4つでまん丸）
      {clip:'inset(0 50% 50% 0)',circle:true},{clip:'inset(0 0 50% 50%)',circle:true},
      {clip:'inset(50% 50% 0 0)',circle:true},{clip:'inset(50% 0 0 50%)',circle:true}];
    default: return [{clip:null,circle:false}];
  }
}
// 各セルの形を決める（mix は三角と四角をまぜる）
function makeCellShapes(){
  const n=G.cols*G.rows;
  if(G.shape!=='mix') return Array(n).fill(G.shape);
  const triCount=Math.max(1, Math.min(n-1, Math.round(n/2)));
  const arr=[]; for(let i=0;i<n;i++) arr.push(i<triCount?'tri':'square');
  return shuffle(arr);
}

function buildPuzzle(){
  resetGame();
  G.boardPx=computeBoardPx(); G.cellPx=G.boardPx/G.cols;
  const board=$('#board'); board.style.width=G.boardPx+'px'; board.style.height=G.boardPx+'px';
  $('#guide').style.backgroundImage=`url(${G.photo})`;

  G.slots=[]; G.pieces=[]; G.solved=0;
  const cell=G.cellPx;
  if(G.shape==='custom'){
    G.cellShapes=[];
    (G.level.polys||[]).forEach(poly=>{
      G.slots.push({x:0, y:0, cx:cell/2, cy:cell/2, clip:polyClip(poly), whole:true});
    });
  } else {
    G.cellShapes = makeCellShapes();
    let ci=0;
    for(let r=0;r<G.rows;r++){
      for(let c=0;c<G.cols;c++){
        const x=c*cell, y=r*cell; const cs=G.cellShapes[ci++];
        subSlotsForCell(cs).forEach(sub=>{
          G.slots.push({x,y, cx:x+cell/2, cy:y+cell/2, clip:sub.clip||null, circle:!!sub.circle});
        });
      }
    }
  }
  drawGrid();
  // ピースをつくる
  G.slots.forEach((slot,i)=>{
    const col=Math.round(slot.x/cell), row=Math.round(slot.y/cell);
    const p={ id:i, slotId:i, placed:false, locked:false,
      rotation: G.rotate ? randRot() : 0, correctRot:0,
      bgX:-col*cell, bgY:-row*cell, clip:slot.clip||null, circle:slot.circle, whole:!!slot.whole };
    p.el=buildPieceEl(p);
    G.pieces.push(p);
  });
  G.total=G.pieces.length;
  updateProgress();

  // トレイ用にシャッフル順
  G.order=[...G.pieces]; shuffle(G.order);
}

// custom（自由タイル）のトレイでの表示サイズ
function customTray(){ return Math.min(Math.round(G.boardPx*0.44), 170); }

function buildPieceEl(p){
  const el=document.createElement('div');
  el.className='piece '+(p.clip?'clip':'square');
  const box = p.whole ? customTray() : G.cellPx;
  el.style.width=box+'px'; el.style.height=box+'px';
  el.style.backgroundImage=`url(${G.photo})`;
  if(p.whole){
    el.style.backgroundSize='100% 100%';  // 画像全体を要素に合わせる（%clipで三角を切り出す→どのサイズでもOK）
  } else {
    el.style.backgroundSize=`${G.boardPx}px ${G.boardPx}px`;
    el.style.backgroundPosition=`${p.bgX}px ${p.bgY}px`;
  }
  if(p.clip) el.style.clipPath=p.clip;
  if(p.circle) el.style.borderRadius='50%'; // 丸ピース
  el.style.setProperty('--rot',`rotate(${p.rotation}deg)`);
  el.style.transform=`rotate(${p.rotation}deg)`;
  attachPointer(el,p);
  return el;
}

function drawGrid(){
  const n=G.boardPx, cell=G.cellPx;
  let lines='', circles='';
  if(G.shape==='custom'){
    lines+=`<rect x="0" y="0" width="${n}" height="${n}"/>`; // 外わく
    (G.level.polys||[]).forEach(poly=>{
      const pts=poly.map(p=>`${(p[0]/100*n).toFixed(1)},${(p[1]/100*n).toFixed(1)}`).join(' ');
      lines+=`<polygon points="${pts}"/>`;
    });
    $('#grid').innerHTML=
      `<svg width="${n}" height="${n}" viewBox="0 0 ${n} ${n}" style="overflow:visible">
        <g fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
           stroke-dasharray="2 10" opacity=".8">${lines}</g>
      </svg>`;
    return;
  }
  // マスの区切り線
  for(let i=0;i<=G.cols;i++){ const x=i*cell; lines+=`<line x1="${x}" y1="0" x2="${x}" y2="${n}"/>`; }
  for(let i=0;i<=G.rows;i++){ const y=i*cell; lines+=`<line x1="0" y1="${y}" x2="${n}" y2="${y}"/>`; }
  // セルごとの分割線・丸
  const shapes=G.cellShapes||[]; let ci=0;
  for(let r=0;r<G.rows;r++) for(let c=0;c<G.cols;c++){
    const cs=shapes[ci++]||G.shape;
    const x=c*cell, y=r*cell, cx=x+cell/2, cy=y+cell/2, rad=cell/2*0.92;
    if(cs==='tri'){
      lines+=`<line x1="${x}" y1="${y}" x2="${x+cell}" y2="${y+cell}"/>`; // 対角線
    } else if(cs==='circle2' || cs==='circle4'){
      circles+=`<circle cx="${cx}" cy="${cy}" r="${rad}"/>`;
      lines+=`<line x1="${cx-rad}" y1="${cy}" x2="${cx+rad}" y2="${cy}"/>`;            // 横の直径
      if(cs==='circle4') lines+=`<line x1="${cx}" y1="${cy-rad}" x2="${cx}" y2="${cy+rad}"/>`; // 縦の直径
    }
  }
  $('#grid').innerHTML=
    `<svg width="${n}" height="${n}" viewBox="0 0 ${n} ${n}" style="overflow:visible">
      <g fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round"
         stroke-dasharray="2 10" opacity=".8">${lines}${circles}</g>
    </svg>`;
}

/* ---------- レイアウト（状態から配置） ---------- */
function layoutAll(){
  const tray=$('#tray'); const board=$('#board');
  G.order.forEach(p=>{
    const el=p.el;
    el.classList.remove('dragging');
    el.style.setProperty('--rot',`rotate(${p.rotation}deg)`);
    if(p.placed){
      if(el.parentElement!==board) board.appendChild(el);
      el.classList.add('placed');
      el.style.position='absolute';
      const s=G.slots[p.slotId];
      if(p.whole){ el.style.width=el.style.height=G.boardPx+'px'; } // 盤面ではボード全体サイズで合成
      el.style.left=s.x+'px'; el.style.top=s.y+'px';
      el.style.margin='0';
      el.style.transform=`rotate(${p.rotation}deg)`;
      if(p.locked) el.classList.add('locked');
    } else {
      if(el.parentElement!==tray) tray.appendChild(el);
      el.classList.remove('placed','locked');
      if(p.whole){ el.style.width=el.style.height=customTray()+'px'; } // トレイでは小さく
      el.style.position='relative';
      el.style.left=el.style.top='';
      el.style.margin='4px';
      el.style.transform=`rotate(${p.rotation}deg)`;
    }
  });
}

/* ---------- ドラッグ＆タップ ----------
   iPad(iOS Safari)対策：要素のポインタキャプチャに頼らず、
   ドラッグ中は document 全体で move/up/cancel を受け取る。
   これで途中でキャプチャが外れても必ずドロップが解決され、
   ピースが宙に浮いたまま消える不具合を防ぐ。 */
const TH=8;
let drag=null; // {p, el, pid, startX, startY, offX, offY, moved, dragging}

// 運んでいる位置＝指より少し上（指で隠れないように浮かせる）
function carryPoint(e){ return { x:e.clientX, y:e.clientY - Math.min(G.cellPx*0.55,100) }; }

function updateDropHint(cx,cy,p){
  const hint=$('#dropHint'); const b=$('#board').getBoundingClientRect(); const cell=G.cellPx;
  const bx=cx-b.left, by=cy-b.top;
  if(bx<0||by<0||bx>=G.boardPx||by>=G.boardPx){ hint.style.display='none'; return; }
  const col=Math.floor(bx/cell), row=Math.floor(by/cell);
  hint.style.display='block';
  hint.style.left=(col*cell)+'px'; hint.style.top=(row*cell)+'px';
  hint.style.width=cell+'px'; hint.style.height=cell+'px';
  const s=G.slots[p.slotId]; const tcol=Math.round(s.x/cell), trow=Math.round(s.y/cell);
  hint.classList.toggle('ok', col===tcol && row===trow); // 正しいマスは緑
}

function onDocMove(e){
  if(!drag || e.pointerId!==drag.pid) return;
  const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
  if(!drag.moved && Math.hypot(dx,dy)>TH) drag.moved=true;
  if(drag.moved && !drag.p.placed){
    if(!drag.dragging){ drag.dragging=true; drag.el.classList.add('dragging');
      // body直下へ移して position:fixed をインラインで明示
      // （layoutAll が付けた position:relative や祖先の transform に負けないように）
      document.body.appendChild(drag.el);
      drag.el.style.position='fixed';
      drag.box = drag.p.whole ? customTray() : G.cellPx;
      drag.el.style.width=drag.box+'px'; drag.el.style.height=drag.box+'px'; drag.el.style.margin='0';
      drag.el.style.transform=`rotate(${drag.p.rotation}deg) scale(1.08)`; }
    const c=carryPoint(e);
    drag.el.style.left=(c.x - drag.box/2)+'px';
    drag.el.style.top =(c.y - drag.box/2)+'px';
    updateDropHint(c.x, c.y, drag.p);
    if(e.cancelable) e.preventDefault();
  }
}
function endDrag(e,cancelled){
  if(!drag) return;
  const d=drag; drag=null;
  document.removeEventListener('pointermove',onDocMove);
  document.removeEventListener('pointerup',onDocUp);
  document.removeEventListener('pointercancel',onDocCancel);
  try{ d.el.releasePointerCapture(d.pid); }catch(_){}
  $('#dropHint').style.display='none';
  if(cancelled){ if(d.dragging){ d.el.classList.remove('dragging'); } layoutAll(); return; }
  if(!d.moved){ // タップ＝回転
    if(G.rotate && !d.p.locked) rotatePiece(d.p);
    return;
  }
  if(!d.p.placed && d.dragging){ d.el.classList.remove('dragging'); const c=carryPoint(e); dropPiece(d.p, c.x, c.y); }
  else { layoutAll(); } // 念のため必ず状態どおりに戻す
}
function onDocUp(e){ if(drag && e.pointerId===drag.pid) endDrag(e,false); }
function onDocCancel(e){ if(drag && e.pointerId===drag.pid) endDrag(e,true); }

function attachPointer(el,p){
  el.addEventListener('pointerdown',e=>{
    if(p.locked) return;
    if(drag) return; // 同時に1つだけ（複数の指を無視）
    audio();
    const r=el.getBoundingClientRect();
    drag={ p, el, pid:e.pointerId, startX:e.clientX, startY:e.clientY,
      offX:e.clientX-r.left, offY:e.clientY-r.top, moved:false, dragging:false };
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    document.addEventListener('pointermove',onDocMove,{passive:false});
    document.addEventListener('pointerup',onDocUp);
    document.addEventListener('pointercancel',onDocCancel);
    // pointerdown では preventDefault しない（iOSがポインタをcancelするのを避ける）。
    // スクロール抑制は .piece の touch-action:none と move 側の preventDefault で行う。
  });
}

function rotatePiece(p){
  p.rotation=(p.rotation+90)%360;
  p.el.classList.add('spin');
  p.el.style.setProperty('--rot',`rotate(${p.rotation}deg)`);
  p.el.style.transform=`rotate(${p.rotation}deg)`;
  sfx.rotate();
  setTimeout(()=>p.el.classList.remove('spin'),200);
  if(p.placed) checkLock(p);
}

function dropPiece(p,px,py){
  const b=$('#board').getBoundingClientRect(); const cell=G.cellPx;
  const bx=px-b.left, by=py-b.top;
  const inBoard = bx>=0 && by>=0 && bx<G.boardPx && by<G.boardPx;
  const col=Math.floor(bx/cell), row=Math.floor(by/cell);
  const s=G.slots[p.slotId]; const tcol=Math.round(s.x/cell), trow=Math.round(s.y/cell);
  if(inBoard && col===tcol && row===trow){ // 正しいマス（光っていたマス）に落とせばOK
    p.placed=true;
    layoutAll();
    sfx.pop();
    checkLock(p);
  } else {
    layoutAll(); // トレイへもどす
  }
}

function checkLock(p){
  if(p.locked) return;
  if(!G.rotate || p.rotation===p.correctRot){
    p.locked=true; p.rotation=0;
    p.el.classList.add('locked');
    p.el.style.transform='rotate(0deg)';
    sfx.lock();
    const s=G.slots[p.slotId];
    sparkleAt($('#board').getBoundingClientRect().left+s.cx, $('#board').getBoundingClientRect().top+s.cy);
    G.solved++; updateProgress();
    if(G.solved>=G.total) winGame();
  } else {
    // むきちがい → ヒント
    p.el.classList.add('wiggle'); sfx.wrong();
    setTimeout(()=>p.el.classList.remove('wiggle'),400);
  }
}

function updateProgress(){ $('#progress').textContent=`${G.solved} / ${G.total}`; }

function sparkleAt(x,y){
  for(let i=0;i<5;i++){
    const s=document.createElement('div'); s.className='spark'; setShape(s, 16+Math.random()*8);
    s.style.left=(x-12+(Math.random()*40-20))+'px'; s.style.top=(y-12+(Math.random()*20-10))+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),750);
  }
}

/* ---------- おいわい（パンパカパーン！完成した絵を出す） ---------- */
function winGame(){
  setTimeout(()=>{
    sfx.win();
    $('#winImg').style.backgroundImage=`url(${G.photo})`; // パズルした絵を表示
    const msgs=['すごい！ かんぺき！','じょうずに できたね！','てんさい！','よく がんばったね！'];
    $('#winMsg').textContent=msgs[Math.floor(Math.random()*msgs.length)];
    $('#win').classList.add('on');
    // いろいろ降ってくる！何度も派手に
    confetti(80);
    [400,850,1400,2000].forEach(t=>setTimeout(()=>{ if($('#win').classList.contains('on')) confetti(55); }, t));
  },420);
}
function confetti(n=60){
  const c=$('#confetti');
  for(let i=0;i<n;i++){
    const s=document.createElement('span'); setShape(s, 14+Math.random()*30);   // 大小いろいろ
    s.style.left=(Math.random()*100)+'vw';
    s.style.animationDuration=(1.6+Math.random()*2.4)+'s'; s.style.animationDelay=(Math.random()*0.5)+'s';
    s.style.opacity=(0.75+Math.random()*0.25);
    c.appendChild(s); setTimeout(()=>s.remove(),5000);
  }
}

/* ---------- ボタン配線 ---------- */
function goLevels(){ buildLevels(); show('s-level'); }
$('#startBtn').onclick=()=>{ audio(); openPhotoScreen(); };
// さいしんに する：キャッシュを避けて最新のページを読み込む（URLに時刻を付与）
$('#ricon').style.backgroundImage=`url("${svgURI('<g fill=\'none\' stroke=\'#9a6bff\' stroke-width=\'2.6\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M20 12a8 8 0 1 1-2.3-5.6\'/><path d=\'M20 4v4h-4\'/></g>')}")`;
$('#reloadBtn').onclick=()=>{ location.replace(location.href.split('?')[0].split('#')[0] + '?v=' + Date.now()); };
$('#settingsBtn').onclick=()=>{ audio(); buildSettings(); show('s-settings'); };
$('#settingsDone').onclick=()=>show('s-title');
$('#backToTitle').onclick=()=>show('s-title');
$('#backToPhoto').onclick=()=>openPhotoScreen();
$('#cameraBtn').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=e=>{ if(e.target.files&&e.target.files[0]) loadUserPhoto(e.target.files[0]); e.target.value=''; };
$('#quitBtn').onclick=()=>show('s-level');
$('#againBtn').onclick=()=>{ audio(); startGame(G.level); };
$('#hintBtn').onclick=function(){ G.hint=!G.hint; $('#guide').style.opacity=G.hint?'':'0'; this.classList.toggle('off'); this.style.opacity=G.hint?'':'.5'; };
$('#winAgain').onclick=()=>{ $('#win').classList.remove('on'); startGame(G.level); };
$('#winNew').onclick=()=>{ $('#win').classList.remove('on'); openPhotoScreen(); };

/* ---------- リサイズ対応 ---------- */
let rt=null;
window.addEventListener('resize',()=>{
  if(!$('#s-game').classList.contains('on')) return;
  clearTimeout(rt);
  rt=setTimeout(()=>{
    const np=computeBoardPx(); if(np===G.boardPx) return;
    // 状態を保ったまま作り直し
    const snap=G.pieces.map(p=>({placed:p.placed,locked:p.locked,rotation:p.rotation}));
    G.boardPx=np; G.cellPx=np/G.cols;
    const board=$('#board'); board.style.width=np+'px'; board.style.height=np+'px';
    const cell=G.cellPx; G.slots=[];
    if(G.shape==='custom'){
      (G.level.polys||[]).forEach(poly=>{ G.slots.push({x:0,y:0,cx:cell/2,cy:cell/2,clip:polyClip(poly),whole:true}); });
      drawGrid();
      // whole ピースは background-size:100% のまま。サイズは layoutAll が設定する。
    } else {
      let ci=0;
      for(let r=0;r<G.rows;r++) for(let c=0;c<G.cols;c++){
        const x=c*cell,y=r*cell; const cs=(G.cellShapes||[])[ci++]||G.shape;
        subSlotsForCell(cs).forEach(sub=>{
          G.slots.push({x,y,cx:x+cell/2,cy:y+cell/2,clip:sub.clip||null,circle:!!sub.circle});
        });
      }
      drawGrid();
      G.pieces.forEach((p)=>{
        const s=G.slots[p.slotId]; const col=Math.round(s.x/cell), row=Math.round(s.y/cell);
        p.bgX=-col*cell; p.bgY=-row*cell;
        const el=p.el; el.style.width=cell+'px'; el.style.height=cell+'px';
        el.style.backgroundSize=`${np}px ${np}px`; el.style.backgroundPosition=`${p.bgX}px ${p.bgY}px`;
      });
    }
    layoutAll();
  },200);
});
</script>
