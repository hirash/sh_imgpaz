name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/ipad-puzzle-game-kids-iatmaw
  workflow_dispatch:

# Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1つに（古いデプロイは中断せず完了させる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        # enablement: true で Pages 未設定でも自動的に有効化する
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # リポジトリ直下の index.html をそのまま公開
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
